services:
  - type: web
    name: bi-t-notice-board
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn noticeboard_cms.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
